theme = "kanagawa-transparent"
# theme = "kanagawa"

[editor]
line-number = "relative"
mouse = false
auto-completion = true
path-completion = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner"]
center = ["file-name"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
#'`' = '`'
'<' = '>'

[keys.normal]
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"
"esc" = ["collapse_selection", "keep_primary_selection"]
"p" = ["replace_with_yanked"]
"a" = ["collapse_selection", "move_char_right", "insert_mode"]
"i" = ["collapse_selection" , "insert_mode"]

[keys.select]
"a" = ["collapse_selection", "move_char_right", "insert_mode"]
"i" = ["collapse_selection" , "insert_mode"]
